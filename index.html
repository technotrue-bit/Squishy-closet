<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffc6df" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aurora's World" />
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffc6df'/%3E%3Cpath d='M4 22c0-9 5-15 12-15s12 6 12 15c0 2-2 4-12 4S4 24 4 22z' fill='%23f2a9cf'/%3E%3Ccircle cx='11' cy='18' r='1.6' fill='%232a1a24'/%3E%3Ccircle cx='21' cy='18' r='1.6' fill='%232a1a24'/%3E%3C/svg%3E"
    />
    <title>Aurora's World</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #ffc6df;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-error" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:24px;text-align:center;font:700 16px system-ui,sans-serif;color:#5a2a4a;background:#ffc6df"></div>
    <script>
      // Show a readable message instead of a blank pink screen if the game cannot start.
      (function () {
        function show(msg) {
          var el = document.getElementById("boot-error");
          if (!el || el.dataset.shown) return;
          el.dataset.shown = "1";
          el.style.display = "flex";
          el.textContent = "Aurora's World could not start: " + msg;
        }
        window.addEventListener("error", function (e) { show(e.message || "unknown error"); });
        window.addEventListener("unhandledrejection", function (e) { show(String(e.reason)); });
      })();
      // Two fingers are a hug, never a page zoom: block pinch and double tap zoom.
      (function () {
        var stop = function (e) { e.preventDefault(); };
        ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
          document.addEventListener(t, stop, { passive: false });
        });
        document.addEventListener("touchmove", function (e) {
          if (e.touches.length > 1 || (e.scale !== undefined && e.scale !== 1)) e.preventDefault();
        }, { passive: false });
        var lastEnd = 0;
        document.addEventListener("touchend", function (e) {
          var now = Date.now();
          if (now - lastEnd < 320 && e.target && e.target.tagName !== "INPUT") e.preventDefault();
          lastEnd = now;
        }, { passive: false });
        document.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
        document.addEventListener("keydown", function (e) {
          if ((e.ctrlKey || e.metaKey) && ["+", "=", "-", "0"].indexOf(e.key) >= 0) e.preventDefault();
        });
      })();
    </script>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
