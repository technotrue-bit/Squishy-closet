<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffc6df" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aurora's World" />
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffc6df'/%3E%3Cpath d='M4 22c0-9 5-15 12-15s12 6 12 15c0 2-2 4-12 4S4 24 4 22z' fill='%23f2a9cf'/%3E%3Ccircle cx='11' cy='18' r='1.6' fill='%232a1a24'/%3E%3Ccircle cx='21' cy='18' r='1.6' fill='%232a1a24'/%3E%3C/svg%3E"
    />
    <title>Aurora's World</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #ffc6df;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      /* The loading screen. It is plain HTML so it shows before any of the game's code has downloaded, and fades
         in only after a moment, so a quick start never flashes it. The game removes it once it has drawn (loading.ts). */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 42%, #ffe3f0 0%, #ffc6df 55%, #f6b3d6 100%);
        font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
        color: #5a2a4a;
        opacity: 0;
        animation: ld-in 0.4s ease-out 0.3s forwards;
        transition: opacity 0.35s ease-in;
        pointer-events: none;
      }
      #loading .ld-stage {
        position: relative;
        width: 150px;
        height: 150px;
      }
      #loading .ld-bun {
        position: absolute;
        left: 15px;
        bottom: 18px;
        width: 120px;
        height: 100px;
        transform-origin: 50% 100%;
        animation: ld-squish 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      #loading .ld-bun .ld-eyes {
        transform-box: fill-box;
        transform-origin: center;
        animation: ld-blink 3.3s infinite;
      }
      #loading .ld-shadow {
        position: absolute;
        left: 35px;
        bottom: 8px;
        width: 80px;
        height: 14px;
        border-radius: 50%;
        background: rgba(200, 90, 140, 0.25);
        animation: ld-shadow 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      #loading .ld-heart {
        position: absolute;
        bottom: 70px;
        width: 22px;
        height: 22px;
        opacity: 0;
        animation: ld-float 2.4s ease-out infinite;
      }
      #loading .ld-heart.h1 { left: 4px; }
      #loading .ld-heart.h2 { right: 2px; width: 16px; height: 16px; animation-delay: 0.8s; }
      #loading .ld-heart.h3 { left: 62px; width: 14px; height: 14px; bottom: 100px; animation-delay: 1.6s; }
      #loading .ld-words {
        font-size: 22px;
        font-weight: 900;
        color: #fff;
        text-shadow: 0 3px 0 #e86fa3, 0 6px 16px rgba(180, 60, 120, 0.3);
        text-align: center;
        padding: 0 16px;
      }
      #loading .ld-dots {
        display: flex;
        gap: 10px;
      }
      #loading .ld-dots i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 2px 0 #e86fa3;
        animation: ld-dot 1.1s ease-in-out infinite;
      }
      #loading .ld-dots i:nth-child(2) { background: #ffe58a; animation-delay: 0.15s; }
      #loading .ld-dots i:nth-child(3) { background: #b9e6ff; animation-delay: 0.3s; }
      @keyframes ld-in { to { opacity: 1; } }
      @keyframes ld-squish {
        0%, 100% { transform: translateY(0) scale(1.12, 0.86); }
        30% { transform: translateY(-34px) scale(0.92, 1.1); }
        50% { transform: translateY(-42px) scale(1, 1); }
        72% { transform: translateY(-6px) scale(0.96, 1.05); }
      }
      @keyframes ld-shadow {
        0%, 100% { transform: scale(1.1); opacity: 1; }
        50% { transform: scale(0.6); opacity: 0.5; }
      }
      @keyframes ld-blink {
        0%, 92%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.1); }
      }
      @keyframes ld-float {
        0% { transform: translateY(0) scale(0.6); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translateY(-60px) scale(1); opacity: 0; }
      }
      @keyframes ld-dot {
        0%, 100% { transform: translateY(0); }
        40% { transform: translateY(-9px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading .ld-bun, #loading .ld-shadow, #loading .ld-heart, #loading .ld-dots i { animation-duration: 3s; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading" role="status" aria-label="Loading Aurora's World">
      <div class="ld-stage">
        <svg class="ld-heart h1" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.7 1.3 5.3 3.2 1.6-1.9 3.1-3.2 5.3-3.2 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#ff6fa8"/></svg>
        <svg class="ld-heart h2" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.7 1.3 5.3 3.2 1.6-1.9 3.1-3.2 5.3-3.2 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#ff9cc8"/></svg>
        <svg class="ld-heart h3" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.7 1.3 5.3 3.2 1.6-1.9 3.1-3.2 5.3-3.2 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#fff"/></svg>
        <div class="ld-shadow"></div>
        <svg class="ld-bun" viewBox="0 0 120 100">
          <path d="M6 78C6 38 30 10 60 10s54 28 54 68c0 10-12 16-54 16S6 88 6 78z" fill="#ffd9ea" stroke="#f2a9cf" stroke-width="4" />
          <path d="M28 34c8-12 20-17 32-17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.8" />
          <g class="ld-eyes" fill="#2a1a24">
            <ellipse cx="42" cy="60" rx="5" ry="6" />
            <ellipse cx="78" cy="60" rx="5" ry="6" />
          </g>
          <circle cx="44" cy="58" r="1.6" fill="#fff" />
          <circle cx="80" cy="58" r="1.6" fill="#fff" />
          <ellipse cx="30" cy="70" rx="7" ry="4" fill="#ff8fbf" opacity="0.6" />
          <ellipse cx="90" cy="70" rx="7" ry="4" fill="#ff8fbf" opacity="0.6" />
          <path d="M54 68q6 6 12 0" fill="none" stroke="#2a1a24" stroke-width="3" stroke-linecap="round" />
        </svg>
      </div>
      <div class="ld-words">Waking up the squishies</div>
      <div class="ld-dots"><i></i><i></i><i></i></div>
    </div>
    <div id="boot-error" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:24px;text-align:center;font:700 16px system-ui,sans-serif;color:#5a2a4a;background:#ffc6df"></div>
    <script>
      // Show a readable message instead of a blank pink screen if the game cannot start.
      // Only while it is starting: once the loading screen is done (loading.ts) the game is running, and a later
      // error must never cover it. And only for the game's own errors: one with no file named ("Script error.") came
      // from a script that isn't the game's, such as one an app's built-in browser adds to every page.
      (function () {
        function show(msg) {
          var el = document.getElementById("boot-error");
          if (!el || el.dataset.shown) return;
          var ld = document.getElementById("loading");
          if (!ld || ld.dataset.done) return;
          el.dataset.shown = "1";
          ld.remove();
          el.style.display = "flex";
          el.textContent = "Aurora's World could not start: " + msg;
        }
        window.addEventListener("error", function (e) {
          if (!e.filename) return;
          show(e.message || "unknown error");
        });
        window.addEventListener("unhandledrejection", function (e) { show(String(e.reason)); });
      })();
      // Two fingers are a hug, never a page zoom: block pinch and double tap zoom.
      (function () {
        var stop = function (e) { e.preventDefault(); };
        ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
          document.addEventListener(t, stop, { passive: false });
        });
        document.addEventListener("touchmove", function (e) {
          if (e.touches.length > 1 || (e.scale !== undefined && e.scale !== 1)) e.preventDefault();
        }, { passive: false });
        var lastEnd = 0;
        document.addEventListener("touchend", function (e) {
          var now = Date.now();
          if (now - lastEnd < 320 && e.target && e.target.tagName !== "INPUT") e.preventDefault();
          lastEnd = now;
        }, { passive: false });
        document.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
        document.addEventListener("keydown", function (e) {
          if ((e.ctrlKey || e.metaKey) && ["+", "=", "-", "0"].indexOf(e.key) >= 0) e.preventDefault();
        });
      })();
    </script>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
